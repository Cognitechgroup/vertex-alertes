name: alertes
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: alertes
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-none
          restore-keys: state-
      - name: Surveiller
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          ICAL_URL: ${{ secrets.ICAL_URL }}
          MES_ADRESSES: ${{ secrets.MES_ADRESSES }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MERCURY_TOKEN: ${{ secrets.MERCURY_TOKEN }}
          WA_CLOUD_TOKEN: ${{ secrets.WA_CLOUD_TOKEN }}
          WA_CLOUD_PHONE_ID: ${{ secrets.WA_CLOUD_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          TG_NOTIF_TOKEN: ${{ secrets.TG_NOTIF_TOKEN }}
          TG_NOTIF_CHAT: ${{ secrets.TG_NOTIF_CHAT }}
          WA_NOTIF_PHONE: ${{ secrets.WA_NOTIF_PHONE }}
          WA_NOTIF_KEY: ${{ secrets.WA_NOTIF_KEY }}
          LEADS_CLIENTS: ${{ secrets.LEADS_CLIENTS }}
          META_LEADS_TOKEN: ${{ secrets.META_LEADS_TOKEN }}
        run: python alertes.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
  garder-actif:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Un commit vide le 1er du mois (GitHub coupe les crons d'un dépôt inactif depuis 60 jours)
        run: |
          if [ "$(date +%d)" = "01" ] && [ "$(date +%H)" = "00" ]; then
            git config user.name "alertes"; git config user.email "alertes@users.noreply.github.com"
            git commit --allow-empty -m "garder le depot actif" && git push
          fi
